name: Android APK

# Lancement manuel : onglet Actions > "Android APK" > Run workflow
# Le workflow peut aussi être lancé sur main ou ionic-migration.
on:
  workflow_dispatch:
  push:
    branches: [main, ionic-migration]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier les identifiants administrateur
        env:
          ADMIN_USER: ${{ secrets.VITE_DEFAULT_ADMIN_USERNAME }}
          ADMIN_PASS: ${{ secrets.VITE_DEFAULT_ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_USER" ] || [ -z "$ADMIN_PASS" ]; then
            echo "::error::Secrets manquants : VITE_DEFAULT_ADMIN_USERNAME et VITE_DEFAULT_ADMIN_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Le dépôt ne contient pas de package-lock.json ; ne pas activer cache: npm.

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Construire l'application web
        env:
          VITE_DEFAULT_ADMIN_USERNAME: ${{ secrets.VITE_DEFAULT_ADMIN_USERNAME }}
          VITE_DEFAULT_ADMIN_PASSWORD: ${{ secrets.VITE_DEFAULT_ADMIN_PASSWORD }}
          VITE_DEFAULT_ADMIN_NAME: ${{ secrets.VITE_DEFAULT_ADMIN_NAME }}
          VITE_PASSWORD_SALT: ${{ secrets.VITE_PASSWORD_SALT }}
        run: npm run build

      - name: Générer le projet Android si absent
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Générer les icônes Android
        run: |
          if [ -d assets ]; then npx --yes @capacitor/assets@3.0.5 generate --android; fi

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Compiler l'APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
