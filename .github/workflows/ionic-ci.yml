name: Ionic CI

on:
  push:
    branches: [main, ionic-migration]
  pull_request:
    branches: [main, ionic-migration]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Pas de cache npm : le dépôt ne contient pas encore de package-lock.json.
          # npm install génère le lockfile nécessaire dans l'environnement CI.

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Vérifier TypeScript
        run: npx tsc --noEmit

      - name: Construire l'application Ionic
        run: npm run build
